split_manifest_name: plan_a_network_holdout
split_manifest_version: 1
source_manifest: dev/active/configs/benchmark_manifest.yaml
strategy: staged_network_holdout

description: >
  Plan A split for EPANET-first experiments. Uses small+medium networks for
  fitting, reserves one small network for validation sanity checks, and keeps
  large networks for transfer-style testing.

partitions:
  train:
    benchmark_ids: [anytown, hanoi]
    role: model_fitting
  validation:
    benchmark_ids: [net1]
    role: pipeline_and_hyperparameter_sanity
  test:
    benchmark_ids: [net3, d_town, l_town]
    role: transfer_and_scalability_evaluation

settings:
  low_label_fractions: [0.05, 0.1, 0.2, 0.5]
  sensor_coverage_levels: [0.25, 0.5, 0.75, 1.0]
  enforce_disjoint_ids: true

generated_artifacts:
  resolved_split_manifest: dev/active/artifacts/plan_a/splits/resolved_split_manifest.json
